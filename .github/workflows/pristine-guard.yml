# Checks that every difference from Tom Perry's source is documented in
# CHANGES-FROM-TOM.md (tools/ci/pristine_guard.py): that the tags
# tom-perry-1.15 (his Windows working copy) and tom-perry-1.15-macos (his
# Apple Silicon one) still have the trees of the record repository, that
# their merge tom-perry-1.15-merged resolves exactly the paths section 1
# lists, as it says, and that every file of his changed after the merge is
# named in section 2. The job summary lists the documented changes with
# their line counts.
#
# Runs on every push to main and every pull request, by hand, and from
# release.yml (workflow_call) before anything is published.

name: Pristine guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  guard:
    name: Pristine guard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # A blobless clone with only the guard's own files checked out:
      # comparing commits needs their trees, not the files' contents, and
      # git fetches the few contents the line counts need when asked. The
      # token stays in .git/config for that; this job only reads.
      - name: Check out
        uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout: |
            .github
            tools/ci

      # Depth 3 reaches the merge's parents and their common base (the
      # parent of tom-perry-1.15-macos)
      - name: Fetch Tom Perry's tags
        run: |
          refspecs=()
          for tag in tom-perry-1.15 tom-perry-1.15-macos tom-perry-1.15-merged; do
            refspecs+=("+refs/tags/$tag:refs/tags/$tag")
          done
          git fetch --no-tags --depth=3 origin "${refspecs[@]}"
          git log --no-walk --format='%H %an %ad %s' tom-perry-1.15 tom-perry-1.15-macos tom-perry-1.15-merged

      - name: Check every difference from Tom Perry's source
        run: python3 tools/ci/pristine_guard.py --summary
